name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .app
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 环境信息
        run: |
          sw_vers
          swift --version

      - name: 回归验证
        run: ./test.sh

      - name: 构建
        run: ./build.sh

      # GitHub 接口提交版本升级时，也能由当前构建创建版本标签和 Release。
      # 普通 main 提交版本号不变，只上传开发构建，不触发发布。
      - name: 确认发布版本
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          RELEASE=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
              echo "标签与应用版本不一致：${GITHUB_REF_NAME} / ${VERSION}" >&2
              exit 1
            fi
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            PREVIOUS="$(git show "${BEFORE_SHA}:Resources/Info.plist" | python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["CFBundleShortVersionString"])')"
            if [[ "$VERSION" != "$PREVIOUS" ]]; then
              # 不允许 main 的版本升级覆盖一个已经存在的版本标签。
              if git rev-parse --verify --quiet "refs/tags/v${VERSION}"; then
                echo "版本标签已存在，请递增版本号：v${VERSION}" >&2
                exit 1
              fi
              RELEASE=true
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: 打包
        id: pack
        run: |
          set -euo pipefail
          if [[ "${{ steps.version.outputs.release }}" == "true" ]]; then
            VERSION="${{ steps.version.outputs.version }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          ARCHS="$(lipo -archs dist/AutoSwitchInput.app/Contents/MacOS/AutoSwitchInput)"
          [[ "$ARCHS" == *"arm64"* && "$ARCHS" == *"x86_64"* ]]
          NAME="AutoSwitchInput-${VERSION}-macos-universal"
          mkdir -p out
          # ditto 能保住 bundle 里的元数据，比 zip -r 稳
          ditto -c -k --sequesterRsrc --keepParent dist/AutoSwitchInput.app "out/${NAME}.zip"
          shasum -a 256 "out/${NAME}.zip" | tee "out/${NAME}.zip.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/*
          if-no-files-found: error

      - name: 发布 Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AutoSwitchInput ${{ steps.pack.outputs.version }}
          body: |
            macOS 菜单栏小工具：为每个应用记住一个输入法，切过去时自动切回来。

            ### 本次更新
            - 修复打开小面板后 VS Code 显示“无法识别”、位置下拉框不可用的问题：先采集目标焦点，再激活面板，避免目标失焦后返回 noValue。
            - 面板内刷新规则时复用本次打开的焦点快照；采集中切换应用或再次点击图标会取消打开，避免旧请求抢焦点。
            - 增加焦点读取返回码、重试结果和元素 class 诊断，并区分目标未应答与辅助功能未授权。
            - 本地实测 VS Code 编辑器、Copilot 聊天框和终端的小面板识别及下拉可用性，96 项回归断言通过。

            ### 升级后的位置识别
            本版本使用临时签名，更新后 macOS 可能不再认可旧的辅助功能授权。
            若 VS Code 编辑器与聊天框无法区分，请到“系统设置 → 隐私与安全性 → 辅助功能”中，
            将 Auto Switch Input 关闭再开启；若仍无效，移除旧条目后重新添加 `/Applications/AutoSwitchInput.app`。
            保留原有规则即可，设置窗口也提供“恢复位置识别…”入口。

            ### 安装
            1. 下载下面的 zip 并解压
            2. 把 `AutoSwitchInput.app` 拖进 `/Applications`
            3. 首次打开前执行（临时签名，未做公证）：
               ```bash
               xattr -dr com.apple.quarantine /Applications/AutoSwitchInput.app
               ```

            需要 macOS 13 或更高版本，通用二进制（Apple Silicon / Intel）。
          files: out/*
          generate_release_notes: true
